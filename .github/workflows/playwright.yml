name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    environment: qa

    # Each value is read from the qa environment's Variables or Secrets, whichever holds it.
    env:
      URL: ${{ vars.URL || secrets.URL }}
      TEST_USERNAME: ${{ secrets.TEST_USERNAME || vars.TEST_USERNAME }}
      TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
      TEST_CLIENT_ID: ${{ vars.TEST_CLIENT_ID || secrets.TEST_CLIENT_ID }}
      TEST_GRANT_TYPE: ${{ vars.TEST_GRANT_TYPE || secrets.TEST_GRANT_TYPE }}
      LOGIN_API: ${{ vars.LOGIN_API || secrets.LOGIN_API }}
      LOCKOUT_TEST_USERNAME: ${{ secrets.LOCKOUT_TEST_USERNAME || vars.LOCKOUT_TEST_USERNAME }}
      LOCKOUT_TEST_PASSWORD: ${{ secrets.LOCKOUT_TEST_PASSWORD }}

    steps:
      - name: Check required CI settings
        run: |
          missing=""
          for name in URL TEST_USERNAME TEST_PASSWORD TEST_CLIENT_ID TEST_GRANT_TYPE LOGIN_API LOCKOUT_TEST_USERNAME LOCKOUT_TEST_PASSWORD; do
            if [ -z "${!name// /}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing CI settings in the qa environment:$missing. Add each one under Settings > Environments > qa (Variables, or Secrets for passwords)."
            exit 1
          fi
          for name in TEST_USERNAME TEST_PASSWORD TEST_CLIENT_ID TEST_GRANT_TYPE; do
            value="${!name}"
            trimmed="$(printf '%s' "$value" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
            if [ "$value" != "$trimmed" ] || printf '%s' "$value" | grep -q $'\r'; then
              echo "::error::$name has a leading or trailing space, tab, or new line. Re-save it in Settings > Environments > qa with no extra characters."
              exit 1
            fi
          done
          if [ "$TEST_USERNAME" = "$LOCKOUT_TEST_USERNAME" ]; then
            echo "::error::LOCKOUT_TEST_USERNAME must be a different account from TEST_USERNAME, or the lockout tests will lock the main account."
            exit 1
          fi
          echo "All required CI settings are present."

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Type-check TypeScript
        run: npm run typecheck

      # Prints only the status and the error body; tokens are removed and secrets are never echoed.
      - name: Check Login API
        continue-on-error: true
        run: |
          origin="$(printf '%s' "$LOGIN_API" | sed -E 's#^(https?://[^/]+).*#\1#')"
          echo "Login API origin: $origin"
          echo "Username length: ${#TEST_USERNAME}, password length: ${#TEST_PASSWORD}"
          status=$(curl -s -o login-response.json -w '%{http_code}' -X POST "$origin/auth/auth/token" \
            --data-urlencode "grant_type=$TEST_GRANT_TYPE" --data-urlencode "client_id=$TEST_CLIENT_ID" \
            --data-urlencode "username=$TEST_USERNAME" --data-urlencode "password=$TEST_PASSWORD")
          echo "Login API status: $status"
          if [ "$status" != "200" ]; then
            jq 'del(.access_token, .refresh_token, .id_token)' login-response.json 2>/dev/null || head -c 500 login-response.json
            echo "::error::Login API returned $status. See the response above."
          fi
          rm -f login-response.json

      - name: Run sanity tests
        run: npm run test:sanity
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/sanity

      - name: Run smoke tests
        if: ${{ !cancelled() }}
        run: npm run test:smoke
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/smoke
      # - name: Run UI tests
      #   if: ${{ !cancelled() }}
      #   run: npx playwright test tests/ui --grep-invert "@lockout|@e2e|@stateful-login"
      #   env:
      #     PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/ui

      # - name: Run hybrid tests
      #   if: ${{ !cancelled() }}
      #   run: npm run test:hybrid
      #   env:
      #     PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/hybrid

      
      - name: Run security tests
        if: ${{ !cancelled() }}
        run: npx playwright test --grep @security --grep-invert @lockout
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/security
      # - name: Run Regression tests
      #   if: ${{ !cancelled() }}
      #   run: npx playwright test --grep @regression --grep-invert "@lockout|@stateful-login"
      #   env:
      #     PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/regression
        
      # - name : Debug API environment safely
      #   run: |
      #     echo "URL host:"
      #     python -c "from urllib.parse import urlparse; print(urlparse('$URL').hostname)"

      #     echo "LOGIN_API host:"
      #     python -c "from urllib.parse import urlparse; print(urlparse('$LOGIN_API').hostname)"

      #     echo "TEST_USERNAME length: ${#TEST_USERNAME}"
      #     echo "TEST_PASSWORD length: ${#TEST_PASSWORD}"
      #     echo "TEST_CLIENT_ID length: ${#TEST_CLIENT_ID}"
      #     echo "TEST_GRANT_TYPE: [$TEST_GRANT_TYPE]"

        

      - name: Run End to End tests
        if: ${{ !cancelled() }}
        run: npx playwright test --grep @e2e
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/e2e

      # # Runs last on purpose: TC-011 to TC-014 lock the dedicated lockout account
      # # (three failed logins). Reset that account before the next pipeline run.
      # - name: Run Login lockout tests (after all other suites)
      #   if: ${{ !cancelled() }}
      #   run: npm run test:lockout
      #   env:
      #     PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/lockout

      - name: Upload HTML reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      # Failed UI and hybrid tests save a full-page screenshot to screenshots/Errors/.
      - name: Upload failure screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots
          path: screenshots/Errors/
          if-no-files-found: ignore
          retention-days: 30
    
