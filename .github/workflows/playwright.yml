name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    environment: qa

    # Each value is read from the qa environment's Variables or Secrets, whichever holds it.
    env:
      URL: ${{ vars.URL || secrets.URL }}
      TEST_USERNAME: ${{ secrets.TEST_USERNAME || vars.TEST_USERNAME }}
      TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
      TEST_CLIENT_ID: ${{ vars.TEST_CLIENT_ID || secrets.TEST_CLIENT_ID }}
      TEST_GRANT_TYPE: ${{ vars.TEST_GRANT_TYPE || secrets.TEST_GRANT_TYPE }}
      LOGIN_API: ${{ vars.LOGIN_API || secrets.LOGIN_API }}
      LOCKOUT_TEST_USERNAME: ${{ secrets.LOCKOUT_TEST_USERNAME || vars.LOCKOUT_TEST_USERNAME }}
      LOCKOUT_TEST_PASSWORD: ${{ secrets.LOCKOUT_TEST_PASSWORD }}

    steps:
      - name: Check required CI settings
        run: |
          missing=""
          for name in URL TEST_USERNAME TEST_PASSWORD TEST_CLIENT_ID TEST_GRANT_TYPE LOGIN_API LOCKOUT_TEST_USERNAME LOCKOUT_TEST_PASSWORD; do
            if [ -z "${!name// /}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing CI settings in the qa environment:$missing. Add each one under Settings > Environments > qa (Variables, or Secrets for passwords)."
            exit 1
          fi
          if [ "$TEST_USERNAME" = "$LOCKOUT_TEST_USERNAME" ]; then
            echo "::error::LOCKOUT_TEST_USERNAME must be a different account from TEST_USERNAME, or the lockout tests will lock the main account."
            exit 1
          fi
          echo "All required CI settings are present."

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Type-check TypeScript
        run: npm run typecheck

      - name: Run smoke tests
        run: npm run test:smoke
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/smoke
      - name: Run Regression tests
        if: ${{ !cancelled() }}
        run: npx playwright test --grep @regression --grep-invert "@lockout|@stateful-login"
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/regression

      # - name: Run High Value tests
      #   if: ${{ !cancelled() }}
      #   run: npx playwright test --grep @high-value --grep-invert "@lockout|@stateful-login"
      #   env:
      #     PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/high-value

      # # Runs last on purpose: TC-011 to TC-014 lock the dedicated lockout account
      # # (three failed logins). Reset that account before the next pipeline run.
      # - name: Run Login lockout tests (after all other suites)
      #   if: ${{ !cancelled() }}
      #   run: npm run test:lockout
      #   env:
      #     PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/lockout

      - name: Upload HTML reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      # Failed UI and hybrid tests save a full-page screenshot to screenshots/Errors/.
      - name: Upload failure screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots
          path: screenshots/Errors/
          if-no-files-found: ignore
          retention-days: 30
